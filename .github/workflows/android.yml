name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.3 and Android export templates
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.3-stable_linux.x86_64 "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import and export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" ./debug.keystore
          godot --headless --editor --path . --quit
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --headless --path . --export-debug Android build/clicker-mania-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clicker-mania-debug-apk
          path: build/clicker-mania-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk build/clicker-mania-debug.apk --clobber
          else
            gh release create latest-apk build/clicker-mania-debug.apk --title "Clicker Mania - Android APK" --notes "Latest Android debug APK, portrait mode." --latest
          fi
