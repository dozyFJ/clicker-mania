[package]
name = "clicker-mania"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "clicker_mania"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "clicker-mania"
path = "src/main.rs"

[dependencies]
wolfcraft-engine = { git = "https://github.com/dozyFJ/WolfCraft", rev = "0897b675aebaa1d496b644d4e73f6f612a03d760" }
wolfcraft-common = { git = "https://github.com/dozyFJ/WolfCraft", rev = "0897b675aebaa1d496b644d4e73f6f612a03d760" }
wgpu = "22.1"
winit = "0.30.13"
egui = "0.29.1"
egui-wgpu = "0.29.1"
egui-winit = { version = "0.29.1", default-features = false, features = ["links", "clipboard"] }
pollster = "0.3"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
android_logger = "0.14"

[package.metadata.android]
package = "com.dozyfj.clickermania"
apk_name = "ClickerMania"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Clicker Mania"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"
